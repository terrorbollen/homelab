# Public traffic arrives through the Cloudflare tunnel, which terminates
# TLS at Cloudflare's edge, so no certificate is issued here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
spec:
  ingressClassName: traefik
  rules:
    - host: friis-jespersen.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 8081
