apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: cluster-subnet-router
spec:
  hostname: cluster-subnet-router
  subnetRouter:
    advertiseRoutes:
      # Only the nodes, not the whole LAN (keeps the router admin page out).
      # Auto-approved by the policy in terraform/tailscale/acl.tf.
      - "192.168.0.36/32"
      - "192.168.0.32/32"
      - "192.168.0.2/32"


