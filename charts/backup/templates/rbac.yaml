apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  namespace: backup
---
# Only the sealed-secrets keys are read through the API; everything else
# comes from host paths.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-read-secrets
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-read-secrets
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-read-secrets
subjects:
  - kind: ServiceAccount
    name: backup
    namespace: backup
