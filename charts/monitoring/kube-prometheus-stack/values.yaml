kube-prometheus-stack:
  grafana:
    # We run Grafana as its own release (charts/monitoring/grafana), so skip
    # deploying a second instance here.
    enabled: false
    # Still generate the Prometheus datasource ConfigMap even with the
    # Grafana pod disabled, so the standalone Grafana's datasource sidecar
    # can pick it up across namespaces.
    forceDeployDatasources: true
    # Keep the chart's own bundled dashboards (in addition to
    # dotdc/grafana-dashboards-kubernetes from argocd/apps/grafana-dashboards.yaml).
    # Still need forceDeployDashboards since the Grafana pod itself is disabled above.
    forceDeployDashboards: true

  prometheus:
    service:
      enabled: true
      type: ClusterIP
      port: 9090
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
