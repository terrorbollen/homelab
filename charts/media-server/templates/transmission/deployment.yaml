apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      containers:
        - name: transmission
          image: "{{ .Values.transmission.image.repository }}:{{ .Values.transmission.image.tag }}"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: CONFIG_FILE
              value: /wg-config/my_wg.conf
          ports:
            - name: http
              containerPort: 9091
          resources:
            {{- toYaml .Values.transmission.resources | nindent 12 }}
          volumeMounts:
            - name: media-ssd
              mountPath: /data
              subPath: downloads/transmission/data
            - name: media-ssd
              mountPath: /config
              subPath: configs/transmission
            - name: wireguard
              mountPath: /wg-config
              readOnly: true
      volumes:
        - name: media-ssd
          persistentVolumeClaim:
            claimName: media-ssd
        - name: wireguard
          secret:
            secretName: wg-secret
