apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-bazarr
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazarr
          image: "{{ .Values.bazarr.image.repository }}:{{ .Values.bazarr.image.tag }}"
          # containerforge images expect a read-only root; writable paths are
          # the emptyDirs below
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: UTC
            - name: UMASK
              value: "0022"
            - name: S6_READ_ONLY_ROOT
              value: "1"
          ports:
            - name: http
              containerPort: 6767
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 12
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.bazarr.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-ssd
              mountPath: /media
              subPath: library
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: media-bazarr-config
        - name: media-ssd
          persistentVolumeClaim:
            claimName: media-ssd
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir:
            medium: Memory
