apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: media.192.168.0.36.nip.io
      http:
        paths:
          {{- range $path, $svc := dict "/transmission" "transmission" "/bazarr" "bazarr" "/sonarr" "sonarr" "/radarr" "radarr" "/prowlarr" "prowlarr" "/" "emby" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: media-{{ $svc }}
                port:
                  name: http
          {{- end }}
    - host: jellyseerr.192.168.0.36.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: media-seerr
                port:
                  name: http
