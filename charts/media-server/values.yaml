# Default values for mediaserver chart
# This is a YAML-formatted file.
#
jellyfin:
  service:
    main:
      ports:
        main:
          port: 80
          protocol: http
          targetPort: 8096 

  securityContext:
    container:
      PUID: 1000 
      runAsUser: 1000
      runAsGroup: 1000
    pod:
      fsGroup: 1000
      supplementalGroups:
        # - 568
        - 1000

  persistence:
    config:
      enabled: true
      type: pvc
      retain: true
      size: 1Gi

    media:
      enabled: true
      type: pvc
      volumeName: media-ssd
      existingClaim: media-ssd
      mountPath: "/media"
      subPath: "library"


bazarr:
  service:
    main:
      ports:
        main:
          port: 80
          protocol: http
          targetPort: 6767

  securityContext:
    container:
      PUID: 1000 
      runAsUser: 1000
      runAsGroup: 1000
    pod:
      fsGroup: 1000
      supplementalGroups:
        # - 568
        - 1000

  persistence:
    config:
      enabled: true
      type: pvc
      retain: true
      size: 1Gi

    media:
      enabled: true
      type: pvc
      volumeName: media-ssd
      existingClaim: media-ssd
      mountPath: "/media"
      subPath: "library"


emby:
  replicaCount: 1
  image:
    repository: linuxserver/emby
    tag: "4.8.11.0"
    pullPolicy: IfNotPresent

  env:
    - name: TZ
      value: "UTC"
    - name: UID
      value: "1000"
    - name: GID
      value: "1000"

  service:
    type: ClusterIP
    port: 80

  volumes:
    - name: "media-ssd"
      persistentVolumeClaim:
        claimName: "media-ssd"

  volumeMounts:
    - name: media-ssd
      mountPath: "/config"
      subPath: "configs/emby"
    - name: media-ssd
      mountPath: "/tv"
      subPath: "library/tv"
    - name: media-ssd
      mountPath: "/movies"
      subPath: "library/movies"


prowlarr:
  replicaCount: 1

  image:
    repository: linuxserver/prowlarr
    tag: "2.0.5.5160-ls125"
    pullPolicy: IfNotPresent

  env:
    - name: TZ
      value: UTC
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"

  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 9696

  persistence:
    configs:
      enabled: true
      existingClaim: media-ssd
      mountPath: /config
      subPath: configs/prowlarr

  resources:
    requests:
      cpu: "100m"
      memory: "250Mi"

radarr:
  replicaCount: 1

  image:
    repository: linuxserver/radarr
    tag: "5.26.2.10099-ls281"
    pullPolicy: IfNotPresent

  env:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"

  service:
    type: ClusterIP
    port: 80

  volumes:
    - name: "media-ssd"
      persistentVolumeClaim:
        claimName: "media-ssd"

  volumeMounts:
    - name: "media-ssd"
      mountPath: "/config"
      subPath: "configs/radarr"
    # Whole-PVC mount (no subPath) so /storage/downloads/... and
    # /storage/library/... share a single bind mount inside this
    # container -- required for "Use Hardlinks instead of Copy" to
    # actually hardlink instead of silently falling back to a full
    # copy. Kubernetes subPath mounts of the same PVC are treated as
    # separate filesystems for hardlink purposes (EXDEV), even though
    # `stat` reports matching device numbers -- confirmed via a direct
    # `ln` test between the old /data and /movies mounts.
    #
    # After deploying this change, in Radarr's UI:
    #   - Settings > Media Management > Root Folder: change
    #     /movies -> /storage/library/movies (existing movies are
    #     untouched on disk; this just re-points Radarr at them)
    #   - Settings > Download Clients > Remote Path Mappings: add
    #     Host=transmission, Remote Path=/data/,
    #     Local Path=/storage/downloads/transmission/data/
    #     (Transmission's own mount is unchanged, so it still reports
    #     download paths as /data/..., but Radarr now sees the same
    #     files at /storage/downloads/transmission/data/...)
    - name: "media-ssd"
      mountPath: "/storage"

  resources:
    requests:
      cpu: "100m"
      memory: "250Mi"
    limits:

sonarr:
  replicaCount: 1

  image:
    repository: linuxserver/sonarr
    tag: "4.0.15.2941-ls290"
    pullPolicy: IfNotPresent

  env:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"

  service:
    type: ClusterIP
    port: 80

  volumes:
    - name: media-ssd
      persistentVolumeClaim:
        claimName: "media-ssd"

  volumeMounts:
    - name: media-ssd
      mountPath: "/config"
      subPath: "configs/sonarr"
    # Whole-PVC mount (no subPath) -- see the matching comment in the
    # radarr section above for why. After deploying, in Sonarr's UI:
    #   - Settings > Media Management > Root Folder: change
    #     /tv -> /storage/library/tv
    #   - Settings > Download Clients > Remote Path Mappings: add
    #     Host=transmission, Remote Path=/data/,
    #     Local Path=/storage/downloads/transmission/data/
    - name: media-ssd
      mountPath: "/storage"

  resources:
    requests:
      cpu: "100m"
      memory: "250Mi"
    limits:

seerr-chart:
  service:
    type: ClusterIP
    port: 80
    annotations: {}

  config:
    persistence:
      size: 5Gi
      accessModes:
        - ReadWriteOnce
      name: 'seerr-config'

# Ingress configuration
ingress:
  enabled: true
  class: traefik
  ip: "192.168.0.36"
  host: "" # Leave empty to use nip.io with the IP
  annotations: {}

storage:
  persistentVolume:
    create: true
    name: "media-ssd"
    labels:
      type: "local"
    capacity: "2Ti"
    accessMode: ReadWriteMany
    hostPath: "/mnt/ssd/media"

  persistentVolumeClaim:
    create: true
    name: "media-ssd"
    accessMode: ReadWriteMany
    capacity: "2Ti"

