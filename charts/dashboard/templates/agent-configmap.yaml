apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-agent
data:
  # Every file in app/agent runs as is under Bun; ConfigMap keys can't hold a "/", so the folder stays flat.
{{- range $path, $_ := .Files.Glob "app/agent/*" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
