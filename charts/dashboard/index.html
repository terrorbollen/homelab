<!doctype html>
<html lang="en" class="h-full [color-scheme:dark]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homelab</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/selfhst/icons/svg/homepage.svg">
  <script src="https://cdn.tailwindcss.com/3.4.16?plugins=typography"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
</head>
<body class="min-h-full bg-slate-950 text-slate-100 antialiased">
  <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_top_left,_rgba(56,189,248,0.15),_transparent_50%),radial-gradient(ellipse_at_bottom_right,_rgba(168,85,247,0.15),_transparent_50%)]"></div>

  <main class="relative mx-auto max-w-6xl px-4 py-10 sm:px-6 sm:py-16">
    <header class="mb-10 flex flex-col gap-6 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p id="greeting" class="text-sm font-medium uppercase tracking-widest text-sky-400"></p>
        <h1 class="mt-1 text-4xl font-semibold tracking-tight">Homelab</h1>
        <p id="clock" class="mt-1 text-slate-400 tabular-nums"></p>
      </div>
      <label class="relative block w-full sm:w-72">
        <input id="search" type="search" placeholder="Filter services…" autocomplete="off"
          class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 pr-10 text-sm placeholder-slate-500 outline-none ring-sky-400/50 backdrop-blur focus:ring-2">
        <kbd class="absolute right-3 top-1/2 -translate-y-1/2 rounded border border-white/15 px-1.5 text-xs text-slate-500">/</kbd>
      </label>
    </header>

    <div id="groups" class="space-y-10"></div>

    <footer class="mt-16 text-center text-xs text-slate-600">
      k3s · beelink · cube01 · cube02 — press <kbd class="rounded border border-white/15 px-1">/</kbd> to filter, <kbd class="rounded border border-white/15 px-1">⌘K</kbd> to jump, <kbd class="rounded border border-white/15 px-1">⌘J</kbd> to chat
    </footer>
  </main>

  <dialog id="palette" class="w-[min(36rem,calc(100vw-2rem))] mt-[15vh] rounded-2xl border border-white/10 bg-slate-900/95 p-0 text-slate-100 shadow-2xl backdrop:bg-slate-950/70 backdrop:backdrop-blur-sm">
    <input id="palette-input" type="text" placeholder="Jump to service…" autocomplete="off"
      class="w-full border-b border-white/10 bg-transparent px-5 py-4 text-base placeholder-slate-500 outline-none">
    <ul id="palette-results" class="max-h-80 overflow-y-auto p-2"></ul>
    <div class="flex gap-4 border-t border-white/10 px-5 py-2.5 text-xs text-slate-500">
      <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span>
    </div>
  </dialog>

  <button id="chat-open" title="Media chat (⌘J)"
    class="fixed bottom-5 right-5 z-10 flex items-center gap-2 rounded-full border border-white/10 bg-slate-900/80 px-4 py-3 text-sm font-medium shadow-lg backdrop-blur transition hover:border-sky-400/50 hover:bg-slate-800">
    <span class="h-2 w-2 rounded-full bg-gradient-to-r from-sky-400 to-fuchsia-400"></span>Ask about media
  </button>

  <aside id="chat" aria-label="Media chat" inert
    class="fixed inset-y-0 right-0 z-20 flex w-full translate-x-full flex-col border-l border-white/10 bg-slate-950/95 shadow-2xl backdrop-blur transition-transform duration-200 sm:w-[30rem]">
    <header class="flex items-center gap-3 border-b border-white/10 px-5 py-4">
      <span class="h-2 w-2 rounded-full bg-gradient-to-r from-sky-400 to-fuchsia-400"></span>
      <h2 class="flex-1 font-semibold">Media buddy</h2>
      <button id="chat-new" class="rounded-lg px-2.5 py-1 text-xs text-slate-400 hover:bg-white/10 hover:text-slate-100">New chat</button>
      <button id="chat-close" class="rounded-lg px-2 py-1 text-slate-400 hover:bg-white/10 hover:text-slate-100" aria-label="Close">✕</button>
    </header>
    <div id="chat-log" class="flex-1 space-y-4 overflow-y-auto px-5 py-4"></div>
    <form id="chat-form" class="flex items-end gap-2 border-t border-white/10 p-3">
      <textarea id="chat-input" rows="1" placeholder="Recommend something from my collection…"
        class="max-h-40 flex-1 resize-none rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm placeholder-slate-500 outline-none ring-sky-400/50 focus:ring-2"></textarea>
      <button id="chat-send" class="rounded-xl bg-sky-500 px-4 py-2.5 text-sm font-medium text-slate-950 hover:bg-sky-400 disabled:opacity-40">Send</button>
    </form>
  </aside>

  <script>
    const lan = (host, path = "/") => `http://${host}.192.168.0.36.nip.io${path}`;
    const icon = (name) => `https://cdn.jsdelivr.net/gh/selfhst/icons/svg/${name}.svg`;

    const groups = [
      {
        name: "Arr stack", accent: "from-sky-400 to-cyan-300", services: [
          { name: "Seerr", desc: "Request movies & shows", url: lan("seerr"), icon: icon("overseerr") },
          { name: "Sonarr", desc: "TV series", url: lan("media", "/sonarr/"), icon: icon("sonarr") },
          { name: "Radarr", desc: "Movies", url: lan("media", "/radarr/"), icon: icon("radarr") },
          { name: "Prowlarr", desc: "Indexers", url: lan("media", "/prowlarr/"), icon: icon("prowlarr") },
          { name: "Bazarr", desc: "Subtitles", url: lan("media", "/bazarr/"), icon: icon("bazarr") },
          { name: "Transmission", desc: "Downloads over VPN", url: lan("media", "/transmission/"), icon: icon("transmission") },
        ],
      },
      {
        name: "Media & apps", accent: "from-fuchsia-400 to-pink-300", services: [
          { name: "Emby", desc: "Streaming", url: lan("media"), icon: icon("emby") },
          { name: "Immich", desc: "Photos", url: lan("immich"), icon: icon("immich") },
          { name: "Obsidian LiveSync", desc: "CouchDB admin", url: lan("obsidian-livesync", "/_utils/"), icon: icon("obsidian") },
          { name: "Portfolio", desc: "friis-jespersen.dev", url: "https://friis-jespersen.dev", icon: icon("homepage") },
        ],
      },
      {
        name: "Infrastructure", accent: "from-amber-300 to-orange-400", services: [
          { name: "Argo CD", desc: "GitOps", url: lan("argocd"), icon: icon("argo-cd") },
          { name: "Grafana", desc: "Metrics & logs", url: lan("grafana"), icon: icon("grafana") },
          { name: "Traefik", desc: "Ingress", url: lan("traefik", "/dashboard/"), icon: icon("traefik") },
        ],
      },
    ];

    const root = document.getElementById("groups");
    for (const group of groups) {
      const section = document.createElement("section");
      section.innerHTML = `
        <h2 class="mb-4 flex items-center gap-3 text-sm font-semibold uppercase tracking-widest text-slate-400">
          <span class="h-2 w-2 rounded-full bg-gradient-to-r ${group.accent}"></span>${group.name}
          <span class="h-px flex-1 bg-white/10"></span>
        </h2>
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>`;
      const grid = section.querySelector("div");
      for (const s of group.services) {
        const a = document.createElement("a");
        a.href = s.url;
        a.dataset.search = `${s.name} ${s.desc} ${group.name}`.toLowerCase();
        a.className = "group relative flex items-center gap-4 rounded-2xl border border-white/10 bg-white/[0.04] p-4 backdrop-blur transition hover:-translate-y-0.5 hover:border-white/25 hover:bg-white/[0.08] focus:outline-none focus:ring-2 focus:ring-sky-400/60";
        a.innerHTML = `
          <div class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-white/5 ring-1 ring-white/10">
            <img src="${s.icon}" alt="" class="h-8 w-8" onerror="this.replaceWith('${s.name[0]}')">
          </div>
          <div class="min-w-0 flex-1">
            <div class="font-medium">${s.name}</div>
            <div class="truncate text-sm text-slate-400">${s.desc}</div>
          </div>
          <span class="status h-2 w-2 rounded-full bg-slate-600" title="Checking…"></span>`;
        grid.append(a);
        // no-cors yields an opaque response: it can't show HTTP status, only that the host answered.
        const dot = a.querySelector(".status");
        fetch(s.url, { mode: "no-cors", signal: AbortSignal.timeout(5000) })
          .then(() => { dot.className = "status h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_8px] shadow-emerald-400"; dot.title = "Reachable"; })
          .catch(() => { dot.className = "status h-2 w-2 rounded-full bg-rose-500"; dot.title = "Unreachable"; });
      }
      root.append(section);
    }

    const search = document.getElementById("search");
    const visible = () => [...root.querySelectorAll("a")].filter((a) => !a.hidden);
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      for (const a of root.querySelectorAll("a")) a.hidden = !a.dataset.search.includes(q);
      for (const section of root.children) section.hidden = !section.querySelector("a:not([hidden])");
    });
    search.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && visible()[0]) location.href = visible()[0].href;
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) { e.preventDefault(); search.focus(); }
      if (e.key === "k" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openPalette(); }
    });

    // fzf-style: the query's letters must appear in order; runs of consecutive
    // letters and matches at word starts score higher. Returns null on no match.
    const fuzzy = (query, text) => {
      const t = text.toLowerCase();
      const hits = [];
      let score = 0, from = 0;
      for (const ch of query.toLowerCase()) {
        const i = t.indexOf(ch, from);
        if (i < 0) return null;
        score += 1 + (i === from && hits.length ? 3 : 0) + (i === 0 || t[i - 1] === " " ? 2 : 0);
        hits.push(i);
        from = i + 1;
      }
      return { score: score - (hits[0] ?? 0) * 0.1, hits };
    };

    const services = groups.flatMap((g) => g.services.map((s) => ({ ...s, group: g.name })));
    const palette = document.getElementById("palette");
    const paletteInput = document.getElementById("palette-input");
    const paletteResults = document.getElementById("palette-results");
    let results = [], selected = 0;

    const renderPalette = () => {
      results = services
        .map((s) => ({ s, m: fuzzy(paletteInput.value, `${s.name} ${s.desc} ${s.group}`) }))
        .filter((r) => r.m)
        .sort((a, b) => b.m.score - a.m.score);
      selected = Math.min(selected, Math.max(results.length - 1, 0));
      paletteResults.innerHTML = results.length ? "" : `<li class="px-3 py-6 text-center text-sm text-slate-500">No matches</li>`;
      results.forEach(({ s, m }, i) => {
        const name = [...s.name].map((c, j) => m.hits.includes(j) ? `<span class="text-sky-400">${c}</span>` : c).join("");
        const li = document.createElement("li");
        li.className = `flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2 ${i === selected ? "bg-white/10" : ""}`;
        li.innerHTML = `
          <img src="${s.icon}" alt="" class="h-6 w-6">
          <span class="flex-1 font-medium">${name}</span>
          <span class="text-xs text-slate-500">${s.group}</span>`;
        li.addEventListener("click", () => (location.href = s.url));
        li.addEventListener("mousemove", () => { if (selected !== i) { selected = i; renderPalette(); } });
        paletteResults.append(li);
      });
      paletteResults.children[selected]?.scrollIntoView({ block: "nearest" });
    };

    const openPalette = () => {
      paletteInput.value = "";
      selected = 0;
      renderPalette();
      palette.showModal();
    };

    paletteInput.addEventListener("input", () => { selected = 0; renderPalette(); });
    paletteInput.addEventListener("keydown", (e) => {
      if ((e.key === "ArrowDown" || e.key === "ArrowUp") && results.length) {
        e.preventDefault();
        selected = (selected + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length;
        renderPalette();
      }
      if (e.key === "Enter" && results[selected]) location.href = results[selected].s.url;
    });
    palette.addEventListener("click", (e) => { if (e.target === palette) palette.close(); });

    // Media chat. Everything it needs is in this block, so if /api is down only the panel shows an error.
    const chat = document.getElementById("chat");
    const chatLog = document.getElementById("chat-log");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const chatSend = document.getElementById("chat-send");
    const store = {
      load() { try { return JSON.parse(localStorage.getItem("chat")) ?? { messages: [] }; } catch { return { messages: [] }; } },
      save() { try { localStorage.setItem("chat", JSON.stringify(state)); } catch {} },
    };
    let state = store.load();

    const openChat = () => { chat.inert = false; chat.classList.remove("translate-x-full"); chatInput.focus(); };
    const closeChat = () => { chat.inert = true; chat.classList.add("translate-x-full"); };
    const chatIsOpen = () => !chat.inert;
    document.getElementById("chat-open").addEventListener("click", openChat);
    document.getElementById("chat-close").addEventListener("click", closeChat);
    document.addEventListener("keydown", (e) => {
      if (e.key === "j" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); chatIsOpen() ? closeChat() : openChat(); }
      if (e.key === "Escape" && chatIsOpen() && !palette.open) closeChat();
    });

    // Model output includes web and review text, so it is untrusted: always sanitise.
    const markdown = (text) => {
      if (!window.marked || !window.DOMPurify) return text.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      return DOMPurify.sanitize(marked.parse(text));
    };

    const addMessage = (role, text = "") => {
      const el = document.createElement("div");
      el.className = role === "user"
        ? "ml-auto w-fit max-w-[85%] whitespace-pre-wrap rounded-2xl rounded-br-sm bg-sky-500/15 px-4 py-2.5 text-sm"
        : role === "error"
          ? "rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-sm text-rose-200"
          : "prose prose-sm prose-invert max-w-none prose-headings:mb-1 prose-headings:mt-4 prose-img:my-2 prose-img:max-h-48 prose-img:rounded-lg prose-a:text-sky-400";
      const body = document.createElement("div");
      const chips = document.createElement("div");
      chips.className = "not-prose mt-1 flex flex-wrap gap-1.5";
      el.append(body, chips);
      const render = (t) => {
        if (role === "assistant") body.innerHTML = markdown(t);
        else body.textContent = t;
      };
      render(text);
      chatLog.append(el);
      chatLog.scrollTop = chatLog.scrollHeight;
      return { render, chips };
    };

    const renderAll = () => {
      chatLog.innerHTML = "";
      if (!state.messages.length) {
        chatLog.innerHTML = `<p class="pt-10 text-center text-sm text-slate-500">Ask what to watch tonight, what's downloading,<br>or tell it to get a title.</p>`;
      }
      for (const m of state.messages) addMessage(m.role, m.text);
    };

    document.getElementById("chat-new").addEventListener("click", () => {
      state = { messages: [] };
      store.save();
      renderAll();
      chatInput.focus();
    });

    async function send(message) {
      if (!state.messages.length) chatLog.innerHTML = "";
      state.messages.push({ role: "user", text: message });
      addMessage("user", message);
      const reply = { role: "assistant", text: "" };
      state.messages.push(reply);
      const view = addMessage("assistant");
      let lastChip = "";
      const fail = (text) => {
        state.messages.push({ role: "error", text });
        addMessage("error", text);
      };
      chatSend.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ message, previousResponseId: state.responseId }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          let end;
          while ((end = buffer.indexOf("\n\n")) >= 0) {
            const [eventLine, dataLine] = buffer.slice(0, end).split("\n");
            buffer = buffer.slice(end + 2);
            const event = eventLine.slice("event: ".length);
            const data = JSON.parse(dataLine.slice("data: ".length));
            if (event === "text") {
              reply.text += data.delta;
              view.render(reply.text);
            } else if (event === "progress" && data.label !== lastChip) {
              lastChip = data.label;
              const chip = document.createElement("span");
              chip.className = "rounded-full border border-white/10 bg-white/5 px-2.5 py-0.5 text-xs text-slate-400";
              chip.textContent = data.label;
              view.chips.append(chip);
            } else if (event === "done") {
              state.responseId = data.responseId;
            } else if (event === "error") {
              fail(data.message);
            }
            chatLog.scrollTop = chatLog.scrollHeight;
          }
        }
      } catch (e) {
        fail(`Can't reach the chat backend (${e.message}). The rest of the dashboard still works.`);
      } finally {
        view.chips.remove();
        if (!reply.text) state.messages.splice(state.messages.indexOf(reply), 1);
        store.save();
        chatSend.disabled = false;
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = chatInput.value.trim();
      if (!message || chatSend.disabled) return;
      chatInput.value = "";
      send(message);
    });
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatForm.requestSubmit(); }
    });
    // Deferred scripts (marked, DOMPurify) have run by DOMContentLoaded.
    addEventListener("DOMContentLoaded", () => {
      window.DOMPurify?.addHook("afterSanitizeAttributes", (node) => {
        if (node.tagName === "A") { node.target = "_blank"; node.rel = "noopener noreferrer"; }
      });
      renderAll();
    });

    const tick = () => {
      const now = new Date();
      const h = now.getHours();
      document.getElementById("greeting").textContent = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      document.getElementById("clock").textContent = now.toLocaleString(undefined, { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
    };
    tick();
    setInterval(tick, 10000);
  </script>
</body>
</html>
