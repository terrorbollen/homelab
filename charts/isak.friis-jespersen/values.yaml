# Default values for isak-friis-jespersen chart
replicaCount: 3

image:
  repository: gigday/ifj
  tag: latest@sha256:2d263b48c0d3c5f783cbd9e7f676c577b3e3a9b618d24c390c827267a79419dd
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
namespace: isakfriis-jespersen

service:
  type: LoadBalancer
  port: 8081
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  # Public traffic arrives through the Cloudflare tunnel, which terminates
  # TLS at Cloudflare's edge, so no certificate is issued here.
  hosts:
    - host: friis-jespersen.dev
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

