apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  namespace: argocd
  annotations:
    # TrueCharts sets hostUsers: true, which this cluster's API server drops.
    # A server-side diff compares against what is actually stored.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/terrorbollen/homelab
    targetRevision: HEAD
    path: charts/media-server
    helm:
      releaseName: media
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    # prune and selfHeal are off by default; Argo drops explicit false values,
    # which would leave the root app permanently OutOfSync.
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
