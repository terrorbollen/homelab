apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obsidian-livesync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/terrorbollen/homelab
    targetRevision: HEAD
    path: charts/obsidian-livesync
    helm:
      releaseName: obsidian-livesync
  destination:
    server: https://kubernetes.default.svc
    namespace: obsidian-livesync
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
