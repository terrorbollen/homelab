apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/terrorbollen/homelab
    targetRevision: HEAD
    path: charts/monitoring/kube-prometheus-stack
    helm:
      releaseName: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus-stack
  syncPolicy:
    # prune and selfHeal are off by default; Argo drops explicit false values,
    # which would leave the root app permanently OutOfSync.
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus Operator CRDs are too large for client-side apply.
      - ServerSideApply=true
