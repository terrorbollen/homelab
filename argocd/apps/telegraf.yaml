apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telegraf
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/terrorbollen/homelab
    targetRevision: HEAD
    path: charts/monitoring/telegraf
    helm:
      releaseName: telegraf-ds
  destination:
    server: https://kubernetes.default.svc
    namespace: telegraf
  syncPolicy:
    # prune and selfHeal are off by default; Argo drops explicit false values,
    # which would leave the root app permanently OutOfSync.
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # influx:telegraf is an aggregated ClusterRole: Kubernetes fills in
    # /rules from the roles matching its aggregationRule, so the chart's
    # rules never match the live object.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: "influx:telegraf"
      jsonPointers:
        - /rules
