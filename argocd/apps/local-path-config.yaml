apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/terrorbollen/homelab
    targetRevision: HEAD
    path: charts/local-path-config
    helm:
      releaseName: local-path-config
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    # prune and selfHeal are off by default; Argo drops explicit false values,
    # which would leave the root app permanently OutOfSync.
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
