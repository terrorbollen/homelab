name: Dashboard agent

on:
  pull_request:
    paths:
      - charts/dashboard/**
      - .github/workflows/dashboard-agent.yml

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/dashboard/app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: charts/dashboard/app/.tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check
      - run: bun test
