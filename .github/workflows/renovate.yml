name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Renovate
        uses: renovatebot/github-action@v46.2.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
